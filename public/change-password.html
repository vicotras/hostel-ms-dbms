<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - HostelMS</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { min-height: 100vh; margin: 0; padding: 20px; display: grid; place-items: center; background: #f3f6fb; color: #1f2937; }
        .card { width: 440px; max-width: 100%; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 8px 32px #11182714; }
        .brand { color: #ea6a16; font-size: 12px; font-weight: bold; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 9px; }
        h1 { font-size: 25px; margin: 0 0 9px; }
        .intro { color: #6b7280; line-height: 1.5; margin: 0 0 21px; font-size: 14px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
        input { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 7px; font-size: 14px; }
        input:focus { outline: 2px solid #fed7aa; border-color: #ea6a16; }
        button { width: 100%; margin-top: 4px; padding: 12px; border: 0; border-radius: 8px; background: #ea6a16; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { opacity: .65; cursor: wait; }
        .message { display: none; margin-bottom: 15px; padding: 10px 12px; border-radius: 7px; font-size: 14px; }
        .message.error { display: block; background: #fee2e2; color: #991b1b; }
        .hint { color: #6b7280; font-size: 12px; margin: 14px 0 0; text-align: center; }
    </style>
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
    <main class="card">
        <div class="brand">HostelMS</div>
        <h1>Choose a private password</h1>
        <p class="intro">Your registration number was used for your first sign-in. Change it now so only you can access your student portal.</p>
        <div id="message" class="message" role="alert"></div>
        <form id="passwordForm">
            <div class="field"><label for="currentPassword">Current password</label><input id="currentPassword" type="password" autocomplete="current-password" required></div>
            <div class="field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
            <div class="field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></div>
            <button id="saveButton" type="submit">Save new password</button>
        </form>
        <p class="hint">Use at least 12 characters. Your password is stored as a secure hash.</p>
    </main>
    <script src="/auth.js"></script>
    <script>
        const form = document.getElementById("passwordForm");
        const message = document.getElementById("message");
        const button = document.getElementById("saveButton");
        form.addEventListener("submit", async event => {
            event.preventDefault();
            message.className = "message";
            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            if (newPassword !== document.getElementById("confirmPassword").value) {
                message.textContent = "The new passwords do not match.";
                message.className = "message error";
                return;
            }
            button.disabled = true;
            try {
                const response = await fetch("/api/auth/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Could not update your password.");
                window.location.replace("/");
            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";
            } finally { button.disabled = false; }
        });
    </script>
</body>
</html>
